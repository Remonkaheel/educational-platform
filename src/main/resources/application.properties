spring.application.name=educational-platform-backend-3

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/educational_platform}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
debug=true
# Hibernate settings
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:}


# JWT configuration
# Do not write the key here: set the JWT_SECRET variable to a strong random value in each environment (at least 32 bytes)
jwt.secret=${JWT_SECRET:dev-secret-change-me-before-deploying-0123456789abcdef}
jwt.expiration=${JWT_EXPIRATION:86400000}

##########
spring.web.resources.static-locations=file:src/main/resources/static/videos
##########
# Enable SpringDoc logs
springdoc.api-docs.enabled=true
logging.level.org.springdoc=DEBUG

####
video.upload.dir=src/main/resources/static/videos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

# List of allowed CORS origins (use "*" for local development only)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# FTP server (used to upload large video files)
# Disabled by default for security reasons; enable it by setting FTP_ENABLED=true with strong credentials
ftp.enabled=${FTP_ENABLED:false}
ftp.port=${FTP_PORT:2121}
ftp.host=${FTP_HOST:localhost}
ftp.username=${FTP_USERNAME:}
ftp.password=${FTP_PASSWORD:}
ftp.home-dir=${FTP_HOME_DIR:src/main/resources/static/videos}
